[package]
name = "tex_to_speech_core"
version = "0.4.0"
edition = "2024"

[dependencies]
pulldown-latex="0.7.1"
log = "0.4.28"
thiserror = "2"
env_logger = {version = "0.11.8", optional = true}
serde = {version = "1.0.228", features = ["derive"], optional = true}
itertools = { version ="0.14", optional = true }
ron = { version = "0.12", optional = true }

[dependencies.mathcat]
git = "https://github.com/simpleclub-extended/MathCAT.git"
rev = "2c8c52cb9e4d6585d386abbbc5d702330a784f92"
features = ["include-zip"]

[dev-dependencies]
itertools = "0.14"
rayon = "1"

[[bin]]
name = "tex_to_speech_core"
required-features = ["env_logger", "serde", "ron", "itertools"]
