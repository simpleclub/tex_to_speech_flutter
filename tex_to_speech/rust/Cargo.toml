[package]
name = "tex_to_speech"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# TODO: switch to main project when https://github.com/fzyzcjy/flutter_rust_bridge/issues/3477 is shipped
flutter_rust_bridge = { git = "https://github.com/simpleclub-extended/flutter_rust_bridge.git", rev = "98473805b0c324dc9868e10be3dadf7fad660662"}
tex_to_speech_core = { path = "../../tex_to_speech_core" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
