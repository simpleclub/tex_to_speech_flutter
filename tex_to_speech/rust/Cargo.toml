[package]
name = "tex_to_speech"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = { git = "https://github.com/simpleclub-extended/flutter_rust_bridge.git", branch = "chore/priv-release"}
tex_to_speech_core = { path = "../../tex_to_speech_core" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
