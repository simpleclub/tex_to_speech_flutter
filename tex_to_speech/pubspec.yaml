name: tex_to_speech
description: "Converts LaTeX to speakable text."
version: 0.0.7
publish_to: none

environment:
  sdk: ^3.9.2
  # Build hooks are stable since Flutter 3.38.
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge:
    # TODO: switch to main project when https://github.com/fzyzcjy/flutter_rust_bridge/issues/3477 is shipped
    git:
      url: "https://github.com/simpleclub-extended/flutter_rust_bridge.git"
      ref: "98473805b0c324dc9868e10be3dadf7fad660662"
      path: "frb_dart"
  flutter_rust_bridge_hooks:
    git:
      url: "https://github.com/simpleclub-extended/flutter_rust_bridge.git"
      ref: "98473805b0c324dc9868e10be3dadf7fad660662"
      path: "frb_hooks"
  code_assets: ^2.2.0
  crypto: ^3.0.6
  ed25519_edwards: ^0.3.1
  path: ^1.9.0

dev_dependencies:
  ffi: ^2.1.3
  ffigen: ^13.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  assets:
    - pkg/
